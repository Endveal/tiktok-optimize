name: Build Cross-Platform Binaries

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: tiktok-patch-windows.exe

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: tiktok-patch-linux

          - os: ubuntu-latest
            target: aarch64-linux-android
            binary_name: tiktok-patch-android-arm64

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Android SDK
        if: matrix.target == 'aarch64-linux-android'
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android NDK
        if: matrix.target == 'aarch64-linux-android'
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Configure Android Linker
        if: matrix.target == 'aarch64-linux-android'
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "$NDK_BIN" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_BIN/aarch64-linux-android21-clang" >> "$GITHUB_ENV"

      - name: Configure Android Linker
        if: matrix.target == 'aarch64-linux-android'
        run: |
          NDK_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "PATH=$NDK_BIN:$PATH" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_BIN/aarch64-linux-android21-clang" >> "$GITHUB_ENV"

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Windows Binary
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/tiktok-patch.exe \
             ./${{ matrix.binary_name }}

      - name: Prepare Linux Binary
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cp target/${{ matrix.target }}/release/tiktok-patch \
             ./${{ matrix.binary_name }}

      - name: Prepare Android Binary
        if: matrix.target == 'aarch64-linux-android'
        run: |
          cp target/${{ matrix.target }}/release/tiktok-patch \
             ./${{ matrix.binary_name }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.binary_name }}